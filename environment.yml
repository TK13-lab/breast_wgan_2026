name: paper3-breast-wgan
channels:
  - conda-forge
  - defaults

# Native R stack for the manuscript workflow.
# Install these with system/native R via `Rscript scripts/setup/install_packages.R`,
# not as Conda `r-*` packages.
# R: 4.5.3
# Bioconductor: 3.22
# BiocManager 1.30.27
# remotes 2.5.0
# devtools 2.5.0
# Seurat 5.4.0
# cowplot 1.2.0
# dplyr 1.2.0
# forcats 1.0.1
# ggh4x 0.3.1
# ggalluvial 0.12.6
# ggplot2 4.0.2
# ggpubr 0.6.3
# ggrepel 0.9.8
# gridExtra 2.3
# msigdbr 26.1.0
# patchwork 1.3.2
# png 0.1-9
# purrr 1.2.1
# RColorBrewer 1.1-3
# readr 2.2.0
# rstatix 0.7.3
# scales 1.4.0
# stringr 1.6.0
# survival 3.5-8
# survminer 0.5.2
# tibble 3.3.1
# tidyr 1.3.2
# yaml 2.3.12
# circlize 0.4.17
# clusterProfiler 4.18.4
# ComplexHeatmap 2.26.1

variables:
  PAPER3_NATIVE_R_VERSION: "4.5.3"
  PAPER3_BIOCONDUCTOR_VERSION: "3.22"
  PAPER3_R_PACKAGE_INSTALLER: "scripts/setup/install_packages.R"
  PAPER3_ENV_NOTE: "Use native R for manuscript R packages; Conda only provisions Python/helper tools."
dependencies:
  - git
  - python=3.12
  - pip
  - pip:
      - numpy
      - pandas
      - scikit-learn
      - matplotlib
      - torch
